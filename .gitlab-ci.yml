# ── Scrollout GitLab CI/CD Pipeline ────────────────────────
# Stages: lint → test → build APK → analyze → publish → pages
#
# Variables requises (Settings > CI/CD > Variables):
#   ANDROID_SDK_URL      (optionnel, défaut: commandlinetools linux)
#   KEYSTORE_BASE64      (protégé, fichier keystore encodé base64)
#   KEYSTORE_PASSWORD    (protégé)
#   KEY_ALIAS            (protégé)
#   KEY_PASSWORD          (protégé)

stages:
  - lint
  - test
  - build
  - analyze
  - publish
  - pages

variables:
  NODE_IMAGE: "node:22-bookworm"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_SDK_TOOLS: "11076708"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
  APK_NAME: "scrollout-${CI_COMMIT_SHORT_SHA}.apk"

# ── Cache ──────────────────────────────────────────────────

.node-cache: &node-cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - echa-app/node_modules/
    policy: pull-push

.gradle-cache: &gradle-cache
  cache:
    key: gradle-${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
      - echa-app/android/.gradle/
    policy: pull-push

# ── Templates ──────────────────────────────────────────────

.node-setup: &node-setup
  image: ${NODE_IMAGE}
  before_script:
    - npm ci
    - cd echa-app && npm ci && cd ..

.android-setup: &android-setup
  image: eclipse-temurin:21-jdk-jammy
  before_script:
    # Android SDK
    - apt-get update -qq && apt-get install -y -qq wget unzip nodejs npm > /dev/null
    - export ANDROID_HOME="${CI_PROJECT_DIR}/android-sdk"
    - mkdir -p ${ANDROID_HOME}/cmdline-tools
    - wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip" -O sdk.zip
    - unzip -q sdk.zip -d ${ANDROID_HOME}/cmdline-tools
    - mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest
    - export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
    # Node deps + Capacitor sync
    - npm ci
    - cd echa-app && npm ci && npm run sync && cd ..
    # Signing (si configuré)
    - |
      if [ -n "${KEYSTORE_BASE64}" ]; then
        echo "${KEYSTORE_BASE64}" | base64 -d > ${CI_PROJECT_DIR}/release.keystore
        cat >> echa-app/android/app/build.gradle <<SIGN

      android {
          signingConfigs {
              release {
                  storeFile file("${CI_PROJECT_DIR}/release.keystore")
                  storePassword "${KEYSTORE_PASSWORD}"
                  keyAlias "${KEY_ALIAS}"
                  keyPassword "${KEY_PASSWORD}"
              }
          }
          buildTypes {
              release {
                  signingConfig signingConfigs.release
              }
          }
      }
      SIGN
      fi

# ── Stage: lint ────────────────────────────────────────────

lint:eslint:
  <<: *node-setup
  <<: *node-cache
  stage: lint
  script:
    - npx eslint . --max-warnings 50
  artifacts:
    when: on_failure
    paths:
      - ci-logs/
    expire_in: 7 days
  after_script:
    - mkdir -p ci-logs
    - npx eslint . --format json -o ci-logs/eslint-report.json || true
  allow_failure: false

lint:typecheck:
  <<: *node-setup
  <<: *node-cache
  stage: lint
  script:
    - npx tsc --noEmit
  artifacts:
    when: on_failure
    paths:
      - ci-logs/
    expire_in: 7 days
  after_script:
    - mkdir -p ci-logs
    - npx tsc --noEmit > ci-logs/tsc-output.log 2>&1 || true

# ── Stage: test ────────────────────────────────────────────

test:vitest:
  <<: *node-setup
  <<: *node-cache
  stage: test
  script:
    - npm test -- --reporter=verbose
  artifacts:
    when: always
    paths:
      - ci-logs/
    reports:
      junit: ci-logs/junit-report.xml
    expire_in: 7 days
  after_script:
    - mkdir -p ci-logs
    - npm test -- --reporter=junit --outputFile=ci-logs/junit-report.xml || true

# ── Stage: build ───────────────────────────────────────────

build:apk:
  <<: *android-setup
  <<: *gradle-cache
  stage: build
  script:
    - cd echa-app/android
    - chmod +x gradlew
    - ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ${CI_PROJECT_DIR}/ci-logs/gradle-build.log
    - cp app/build/outputs/apk/release/app-release*.apk ${CI_PROJECT_DIR}/${APK_NAME}
  artifacts:
    paths:
      - "${APK_NAME}"
      - ci-logs/
    expire_in: 30 days
  after_script:
    - mkdir -p ci-logs

# ── Stage: analyze (auto-diagnostic si échec) ─────────────

analyze:logs:
  <<: *node-setup
  stage: analyze
  when: on_failure
  needs:
    - job: lint:eslint
      optional: true
    - job: lint:typecheck
      optional: true
    - job: test:vitest
      optional: true
    - job: build:apk
      optional: true
  script:
    - echo "── Analyzing CI failure logs ──"
    - |
      for logfile in ci-logs/*.log ci-logs/*.json; do
        if [ -f "$logfile" ]; then
          echo ""
          echo "=== Analyzing: $logfile ==="
          npx tsx scripts/ci-analyze-logs.ts "$logfile" || true
        fi
      done
    - |
      # Consolidate all logs into a single JSON report
      echo '{"jobs":[]}' > ci-logs/analysis-report.json
      for logfile in ci-logs/*.log; do
        if [ -f "$logfile" ]; then
          npx tsx scripts/ci-analyze-logs.ts "$logfile" --json > "ci-logs/$(basename $logfile .log)-analysis.json" || true
        fi
      done
  artifacts:
    paths:
      - ci-logs/
    expire_in: 7 days

# ── Stage: publish (Generic Package Registry) ─────────────

publish:registry:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - job: build:apk
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      echo "Publishing APK v${VERSION} to GitLab Package Registry..."
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "${APK_NAME}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/scrollout-apk/${VERSION}/${APK_NAME}"
      echo ""
      echo "Download: ${CI_PROJECT_URL}/-/packages"

# ── Stage: pages (distribution APK) ───────────────────────

pages:
  stage: pages
  image: ${NODE_IMAGE}
  needs:
    - job: build:apk
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public/download
    - cp "${APK_NAME}" "public/download/${APK_NAME}"
    - cp "${APK_NAME}" "public/download/scrollout-latest.apk"
    # Generate download page
    - |
      cat > public/index.html <<'HTML'
      <!DOCTYPE html>
      <html lang="fr">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scrollout - Download APK</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
          .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 48px; max-width: 480px; text-align: center; }
          h1 { font-size: 2rem; margin-bottom: 8px; color: #fff; }
          .version { color: #888; font-size: 0.9rem; margin-bottom: 32px; }
          .btn { display: inline-block; background: #4f46e5; color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 10px; font-size: 1.1rem; font-weight: 600; transition: background 0.2s; }
          .btn:hover { background: #4338ca; }
          .meta { margin-top: 24px; font-size: 0.8rem; color: #666; }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>Scrollout</h1>
      HTML
    - echo "    <p class=\"version\">Build ${CI_COMMIT_SHORT_SHA} &mdash; $(date -u +%Y-%m-%d)</p>" >> public/index.html
    - |
      cat >> public/index.html <<'HTML'
          <a class="btn" href="download/scrollout-latest.apk">Telecharger l'APK</a>
          <p class="meta">Android 7.0+ requis</p>
        </div>
      </body>
      </html>
      HTML
  artifacts:
    paths:
      - public
